<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>DevFinder</title>
        <meta name="author" content="Matt RODRIGUEZ">
        <meta name="description" content="A short description...">
        <meta name="keywords" content="HTML, CSS, JavaScript">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="main-container">
            <div class="main-card-container">
                <div class="main-card-informations">
                    <h1>DevFinder</h1>
                    <form action="" method="post" class="form-container-light">
                        <button type="button" id="light-button">Light</button>
                    </form>
                </div>
                <div class="main-card-search-bar">
                    <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  fill="#21BCFF" viewBox="0 0 24 24" >
                        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                        <path d="M18 10c0-4.41-3.59-8-8-8s-8 3.59-8 8 3.59 8 8 8c1.85 0 3.54-.63 4.9-1.69l5.1 5.1L21.41 20l-5.1-5.1A8 8 0 0 0 18 10M4 10c0-3.31 2.69-6 6-6s6 2.69 6 6-2.69 6-6 6-6-2.69-6-6"></path>
                    </svg>
                    <form action="" method="post" class="form-container">
                        <input type="text" name="name-to-search" id="name-to-search" required placeholder="Search GitHub username...">
                        <button type="button" id="search-button">Search</button>
                    </form>
                </div>
                <div class="main-card-data-fetched-container">
                    <div class="profile-img-container">
                        <img src="https://avatars.githubusercontent.com/u/583231?v=4" class="profile-img" alt="Profile image fetched">
                    </div>
                    <div class="profile-data-container">
                        <div class="profile-data-account-container">
                            <p class="profile-data-name">TITLE NAME</p>
                            <p class="profile-data-id">@ID</p>
                            <p class="profile-data-bio">Bio</p>
                            <p class="profile-data-joined">Joined</p>
                        </div>
                        <div class="profile-data-git-container">
                            <div class="repos-container">
                                <p class="repos-title">Repos</p>
                                <p class="repos-value">0</p>
                            </div>
                            <div class="followers-container">
                                <p class="followers-title">Followers</p>
                                <p class="followers-value">0</p>
                            </div>
                            <div class="following-container">
                                <p class="following-title">Following</p>
                                <p class="following-value">0</p>
                            </div>
                        </div>
                        <div class="profile-data-link-container">
                            <div class="link-container">
                                <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                                fill="currentColor" viewBox="0 0 24 24" >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path d="M16 10c0-2.21-1.79-4-4-4s-4 1.79-4 4 1.79 4 4 4 4-1.79 4-4m-6 0c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2"></path><path d="M11.42 21.81c.17.12.38.19.58.19s.41-.06.58-.19c.3-.22 7.45-5.37 7.42-11.82 0-4.41-3.59-8-8-8s-8 3.59-8 8c-.03 6.44 7.12 11.6 7.42 11.82M12 4c3.31 0 6 2.69 6 6 .02 4.44-4.39 8.43-6 9.74-1.61-1.31-6.02-5.29-6-9.74 0-3.31 2.69-6 6-6"></path>
                                </svg>
                                <p class="link-location">Location</p>
                            </div>
                            <div class="link-container">
                                <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                                fill="currentColor" viewBox="0 0 24 24" >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path d="M8 6a1 1 0 1 0 0 2 1 1 0 1 0 0-2"></path><path d="M13.05 4.41A5.5 5.5 0 0 0 8.5 2 5.51 5.51 0 0 0 3 7.5c0 .09.02.17.02.26C2.4 8.31 2 9.1 2 10h1.62a5.56 5.56 0 0 0 3.37 2.77c.2 1.65.99 5.22 4.01 6.63V22h2v-2.05c.27.03.55.05.85.05.41 0 .78-.04 1.15-.07V22h2v-2.4c1.22-.32 2.14-.78 2.75-1.17l1.42 2.13 1.66-1.11-1.99-2.99zm.66 4.7 4.62 7.14c-2.15.19-3.73-1-4.51-2.27-.75-1.23-1.11-3.09-.1-4.86ZM8.92 11.9l-.03-.84-.84-.11C6.31 10.72 5 9.24 5 7.5 5 5.57 6.57 4 8.5 4c1.16 0 2.24.57 2.89 1.53l1.13 1.75c-1.77 2.31-1.93 5.27-.41 7.75.84 1.36 2.04 2.33 3.43 2.85-.51.08-1.07.13-1.69.13-4.47 0-4.89-5.08-4.93-6.1Z"></path>
                                </svg>
                                <p class="link-twitter">Twitter</p>
                            </div>
                            <div class="link-container">
                                <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                                fill="currentColor" viewBox="0 0 24 24" >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path d="M9.88 18.36a3 3 0 0 1-4.24 0 3 3 0 0 1 0-4.24l2.83-2.83-1.41-1.41-2.83 2.83a5.003 5.003 0 0 0 0 7.07c.98.97 2.25 1.46 3.54 1.46s2.56-.49 3.54-1.46l2.83-2.83-1.41-1.41-2.83 2.83Zm2.83-14.14L9.88 7.05l1.41 1.41 2.83-2.83a3 3 0 0 1 4.24 0 3 3 0 0 1 0 4.24l-2.83 2.83 1.41 1.41 2.83-2.83a5.003 5.003 0 0 0 0-7.07 5.003 5.003 0 0 0-7.07 0Z"></path><path d="m16.95 8.46-.71-.7-.7-.71-4.25 4.24-4.24 4.25.71.7.7.71 4.25-4.24z"></path>
                                </svg>
                                <p class="link-blog">Blog</p>
                            </div>
                            <div class="link-container">
                                <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                                fill="currentColor" viewBox="0 0 24 24" >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path d="M21 6h-4V4c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v3.38L2.11 9.83A2 2 0 0 0 1 11.62V21c0 .55.45 1 1 1h20c.55 0 1-.45 1-1V8c0-1.1-.9-2-2-2m0 14H7v-8.01L5 13v7H3v-8.38L8.45 8.9A1 1 0 0 0 9 8.01v-4h6v3c0 .55.45 1 1 1h5v12Z"></path><path d="M11 10h2v2h-2zm0 4h2v2h-2zm0-8h2v2h-2zm6 8h2v2h-2zm0-4h2v2h-2z"></path>
                                </svg>
                                <p class="link-company">Company</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
